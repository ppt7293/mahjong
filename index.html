<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const N="東南西北白發中",RN=["東1","東2","南1","南2","西1","西2","北1","北2"];
const nt=t=>t==16?4:t;
const tn=i=>{i=nt(i);return i<9?(i+1)+"索":N[i-9]};
const SC={g:"#1a7a4a",r:"#c0392b",b:"#1f5f9e"};
const stk=(x,y,c,h=14,w=5.5)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2.4" fill="${c}"/><rect x="${x+1}" y="${y+1.5}" width="1.2" height="${h-3}" rx=".6" fill="#fff" opacity=".35"/><path d="M${x} ${y+h/2}h${w}" stroke="#f6f1de" stroke-width="1"/>`;
const bird=()=>`<path d="M20 42c-3 5-6 8-10 10M20 42c3 5 6 8 10 10M20 43v9" stroke="#c0392b" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="20" cy="31" rx="9" ry="12" fill="#1a7a4a"/><ellipse cx="20" cy="33" rx="5" ry="8" fill="#2fa86a"/><circle cx="20" cy="16" r="5.5" fill="#1a7a4a"/><path d="M25 16l6 2-6 2z" fill="#e0a526"/><circle cx="21.5" cy="15" r="1.2" fill="#fff"/><path d="M17 10c0-3 1-4 3-5M20 10c0-3 2-4 4-4" stroke="#c0392b" stroke-width="1.4" fill="none"/>`;
const mShape=(y0,c,fl)=>{const t=(cx,cy,h,r)=>`<g transform="rotate(${r} ${cx} ${cy})">${stk(cx-2.5,cy-h/2,c,h,5)}</g>`;const o=t(7,y0+11,22,0)+t(33,y0+11,22,0)+t(14.75,y0+8,17.5,-37)+t(25.25,y0+8,17.5,37);return fl?`<g transform="matrix(1 0 0 -1 0 ${2*(y0+11)})">${o}</g>`:o};
function souSvg(n,red){const R=SC.r,G=red?R:SC.g,s=(x,y,c,h=19)=>stk(x,y,c,h,6),col=[7,17,27];
 if(n==1)return bird();
 if(n==2)return s(17,6,G)+s(17,31,G);
 if(n==3)return s(17,6,G)+s(9.5,31,G)+s(24.5,31,G);
 if(n==4)return s(9.5,6,G)+s(24.5,6,G)+s(9.5,31,G)+s(24.5,31,G);
 if(n==5)return s(8,6,G,15)+s(26,6,G,15)+s(8,35,G,15)+s(26,35,G,15)+s(17,20.5,R,15);
 if(n==6)return col.map(x=>s(x,7,G)+s(x,30,G)).join("");
 if(n==7)return s(17,3,R,13)+col.map(x=>s(x,19,G,16)+s(x,37,G,16)).join("");
 if(n==8)return mShape(4,G,1)+mShape(30,G);
 return col.map((x,i)=>[5,22,39].map(y=>s(x,y,i==1?R:G,12)).join("")).join("")}
let DS=null;
const tl=(i,c="")=>{const dr=DS&&DS.has(nt(i))&&!/\bni\b/.test(c)?" dr":"";const k=i==16?" ak":i==15?" r":i==14?" g":i<9?" s":"";let f;
 if(i<9||i==16)f=`<svg viewBox="0 0 40 56" class="sv">${souSvg(nt(i)+1,i==16)}</svg>`;
 else if(i==13)f="";
 else f=`<span class="hz">${N[i-9]}</span>`;
 return `<span class="t ${c}${k}${dr}">${f}</span>`};
const bk=n=>Array(n).fill('<span class="t sm bk"></span>').join("");
const cnt=a=>{const c=Array(16).fill(0);a.forEach(x=>c[nt(x)]++);return c};
const srt=a=>a.sort((x,y)=>nt(x)-nt(y)||x-y),cl=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const UN=[["億",1e8],["兆",1e12],["京",1e16],["垓",1e20],["秭",1e24],["穣",1e28],["溝",1e32],["澗",1e36],["正",1e40],["載",1e44],["極",1e48]];
const fmtB=(n,sf)=>{const a=Math.abs(n),t=a.toLocaleString("en-US",{useGrouping:false,maximumFractionDigits:0});let u=null;for(const x of UN)if(a>=x[1])u=x;
 return(n<0?"-":"")+t+(u?`（${(a/u[1]).toFixed(1)}${u[0]}点）`:sf)};
const fmt=n=>fmtB(n,""),fmtP=n=>fmtB(n,"点");
const doraOf=i=>{i=nt(i);return i<9?(i+1)%9:i<13?9+(i-8)%4:13+(i-12)%3};
/* ---- 和了判定 ---- */
function sets(c,n,acc,out){const i=c.findIndex(x=>x>0);
 if(i<0){if(n==0)out.push(acc.slice());return}if(n==0)return;
 if(c[i]>=3){c[i]-=3;acc.push(["k",i]);sets(c,n-1,acc,out);acc.pop();c[i]+=3}
 if(i<7&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;acc.push(["s",i]);sets(c,n-1,acc,out);acc.pop();c[i]++;c[i+1]++;c[i+2]++}}
function decomp(c,n){const out=[];for(let p=0;p<16;p++)if(c[p]>=2){c[p]-=2;const o=[];sets(c,n,[],o);o.forEach(s=>out.push({p,s}));c[p]+=2}return out}
const isWin=(c,n)=>decomp(c,n).length>0||(n==4&&c.filter(x=>x==2).length==7);
const tenpai=(h,nm)=>{for(let t=0;t<16;t++){const c=cnt(h);if(c[t]>=4)continue;c[t]++;if(isWin(c,4-nm))return true}return false};
function evalH(g,m,conc,tsumo){
 const ml=g.melds[m],n=4-ml.length,men=ml.every(x=>x.k=="kan"&&!x.open),c=cnt(conc);
 const at=conc.concat(...ml.map(x=>x.tiles)),all=cnt(at);
 const rw=9+(g.round>>1),sw=9+(m==g.dealer?0:1);
 const ds=decomp(c,n).map(d=>({p:d.p,s:d.s.concat(ml.map(x=>[x.k=="chi"?"s":"k",nt(x.tiles[0])]))}));
 if(men&&c.filter(x=>x==2).length==7)ds.push({chi:1});
 if(!ds.length)return null;
 const com=[],hon=all.slice(9).reduce((a,b)=>a+b,0);
 if(men&&g.riichi[m])com.push(["リーチ",1]);
 if(men&&tsumo)com.push(["門前清自摸和",1]);
 if(all[0]+all[8]+hon==0)com.push(["断幺九",1]);
 if(hon==0)com.push(["清一色",men?6:5]);else com.push(["混一色",men?3:2]);
 let ym=[];
 if([0,4,6,8,9,10,11,12,13,15].every(i=>!all[i]))ym.push(["緑一色",13]);
 if(all.slice(0,9).every(x=>!x))ym.push(["字一色",13]);
 if(hon==0&&ml.length==0&&c[0]>=3&&c[8]>=3&&[1,2,3,4,5,6,7].every(i=>c[i]>=1))ym.push(["九蓮宝燈",13]);
 if(hon>0&&all[0]+all[8]>0&&all.slice(1,8).every(x=>!x))com.push(["混老頭",2]);
 let best=null;
 for(const d of ds){
  let y=com.slice(),fu=20,yd=ym.slice();
  if(d.chi){y.push(["七対子",2]);fu=25}
  else{
   d.s.forEach(([k,i],j)=>{if(k=="k"){
     if(i>=13)y.push(["役牌 "+tn(i),1]);if(i==rw)y.push(["場風 "+tn(i),1]);if(i==sw)y.push(["自風 "+tn(i),1]);
     const mm=ml[j-n],cc=j<n||(mm.k=="kan"&&!mm.open);fu+=((i==0||i==8||i>8)?8:4)*(mm&&mm.k=="kan"?4:1)/(cc?1:2)}});
   if(d.s.every(s=>s[0]=="k"))y.push(["対々和",2]);
   const ks=d.s.filter(s=>s[0]=="k").map(s=>s[1]),wtile=nt(conc[conc.length-1]);
   if([13,14,15].every(x=>ks.includes(x)))yd.push(["大三元",13]);
   else if(ks.filter(x=>x>=13).length==2&&d.p>=13)y.push(["小三元",2]);
   const wk=ks.filter(x=>x>=9&&x<=12).length;
   if(wk==4)yd.push(["大四喜",13]);else if(wk==3&&d.p>=9&&d.p<=12)yd.push(["小四喜",13]);
   const cck=d.s.filter(([k],j)=>k=="k"&&(j<n||(ml[j-n].k=="kan"&&!ml[j-n].open))).length;
   if(cck==4&&(tsumo||(d.p==wtile&&c[wtile]==2)))yd.push(["四暗刻",13]);
   if(ml.length==4&&ml.every(x=>x.k=="kan"))yd.push(["四槓子",13]);
   const sq=d.s.filter(s=>s[0]=="s").map(s=>s[1]);
   if(men&&sq.some((a,i)=>sq.indexOf(a)!=i))y.push(["一盃口",1]);
   if([0,3,6].every(a=>sq.includes(a)))y.push(["一気通貫",men?2:1]);
   if(d.p>=13)fu+=2;if(d.p==rw)fu+=2;if(d.p==sw)fu+=2;
   fu+=tsumo?2:(men?10:0);fu=Math.ceil(fu/10)*10}
  let han=y.reduce((a,b)=>a+b[1],0);
  y=y.concat(yd);han+=yd.reduce((a,b)=>a+b[1],0);if(!y.length)continue;{
   const dn=g.dora.reduce((a,i)=>a+all[doraOf(i)],0),rd=at.filter(x=>x==16).length,
   un=men&&g.riichi[m]?g.ura.slice(0,g.dora.length).reduce((a,i)=>a+all[doraOf(i)],0):0;
   if(dn){y.push(["ドラ",dn]);han+=dn}if(rd){y.push(["赤ドラ",rd]);han+=rd}if(un){y.push(["裏ドラ",un]);han+=un}}
  if(!y.length)continue;
  const pts=fu*2**(han+2)*(m==g.dealer?6:4);
  if(!best||pts>best.pts)best={yaku:y,han,fu,pts,rii:men&&g.riichi[m],ura:(g.ura||[]).slice(0,g.dora.length)}}
 return best}
/* ---- ゲーム進行 ---- */
const wt=(h,nm)=>{const r=[];for(let t=0;t<16;t++){const c=cnt(h);if(c[t]>=4)continue;c[t]++;if(isWin(c,4-nm))r.push(t)}return r};
const ank=(g,m)=>g.melds[m].every(x=>x.k=="kan"&&!x.open);
const furi=(g,m)=>{const w=wt(g.hands[m],g.melds[m].length);return w.length>0&&(g.fur[m]||w.some(x=>g.dh[m].some(t=>nt(t)==x)))};
function dgame(g){g.phase="result";g.res={kind:"draw"};(g.hist=g.hist||[]).push({rn:RN[g.round],w:-1})}
function draw(g,p){if(!g.wall.length){dgame(g);return}g.drawn=g.wall.pop();g.turn=p;g.phase="discard"}
function deal(g){const w=[];for(let i=0;i<16;i++)for(let k=0;k<4;k++)w.push(i==4&&!k?16:i);
 for(let i=w.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[w[i],w[j]]=[w[j],w[i]]}
 g.hands=[srt(w.splice(0,13)),srt(w.splice(0,13))];g.dora=w.splice(0,g.doraN);g.ura=w.splice(0,g.doraN+4);g.wall=w;g.dh=[[],[]];g.fur=[false,false];g.rj=[-1,-1];
 g.melds=[[],[]];g.disc=[[],[]];g.riichi=[false,false];g.dealer=g.round%2;g.last=null;g.res=null;g.drawn=null;draw(g,g.dealer)}
function opts(g,o){const t=nt(g.last.t),h=g.hands[o],c=cnt(h),r={chi:[]};
 r.rr=evalH(g,o,h.concat(g.last.t),false);r.ron=!!r.rr&&!furi(g,o);
 if(!g.riichi[o]){r.pon=c[t]>=2;r.kan=c[t]>=3&&g.wall.length>1;
}
 r.any=r.ron||r.pon||r.kan||r.chi.length>0;return r}

  if(i<7&&c[i+2]){c[i]--;c[i+2]--;rec(i,m,t+1,p);c[i]++;c[i+2]++}
  c[i]--;rec(i,m,t,p);c[i]++};
 rec(0,0,0,0);

 return best}
